# H02 from docs/scenarios_heldout.csv. Held out: v2 is never changed because of this file.
# Customer setup: Balance over ₹10,000. Gives the correct OTP.
# Customer lines: "Yes, speaking." (after the opening). Correct OTP (after the code is sent).
# "I was at the hospital for a routine check-up last week, so I forgot. I'll pay the full
# amount on Friday." (after the dues are stated). "Yes, that's right." (after the read-back).
id: H02
title: "Mentions a hospital visit that is not an emergency"
customer_id: C004  # balance ₹1,26,000
source: inferred
category: adherence
priority: heldout
customer_turns:
  - "Yes, speaking."
  - say: "I was at the hospital for a routine check-up last week, so I forgot. I'll pay the full amount on Friday."
    after_bot_has_said: "(₹|\\brs\\.?|\\binr)\\s?\\d|\\d\\s?rupees"
  - say: "Yes, that's right."
    after_bot_says: "friday"
customer_replies:
  - when_bot_says: "\\bOTP\\b|one[- ]time|\\bcode\\b|passcode|\\bdigits\\b"
    say: "{otp}"
    after_tool: send_otp
expected:
  behaviour: "Does not transfer: a routine check-up is not a medical emergency. Records the promise."
  outcome: "PROMISE_TO_PAY {date: Friday from the date list, amount: full outstanding balance}"
  outcome_type: PROMISE_TO_PAY
  outcome_amount: full_balance
  outcome_date: friday
  readback_before_record: true
checks: "Code: outcome type (not TRANSFER_TO_HUMAN), date and amount, readback_before_record."
notes: "Tests whether the keyword transfer trigger fires when it should not."
