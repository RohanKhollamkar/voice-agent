# S13 from docs/scenarios.csv. Format: see README.md in this folder.
# Customer setup: Balance over ₹10,000. Gives the correct OTP.
# Customer lines: "How much interest and late fee will I be charged?" (after the dues are stated).
# Added here, not in the CSV: the last two lines, so the call can reach an outcome, and a "yes, that's right" reply to read-backs.
id: S13
title: "Asks about interest and late fee, balance over ₹10,000"
customer_id: C001
source: brief
category: factual
priority: core
customer_turns:
  - "Yes, speaking."
  - say: "How much interest and late fee will I be charged?"
    after_bot_has_said: "(₹|\\brs\\.?|\\binr)\\s?\\d|\\d\\s?rupees"
  - "Okay. I will pay the minimum due on Friday."
  - "Thank you, bye."
customer_replies:
  - when_bot_says: "\\bOTP\\b|one[- ]time|\\bcode\\b|passcode|\\bdigits\\b"
    say: "{otp}"
    after_tool: send_otp  # a code cannot be read out before it is sent
  - when_bot_says: "(?=[\\s\\S]*(?:₹\\s?\\d|\\d\\s?rupees))(?=[\\s\\S]*(?:monday|tuesday|wednesday|thursday|friday|saturday|sunday|\\b\\d{1,2}(?:st|nd|rd|th)?\\s+(?:of\\s+)?(?:november|december|january)|\\b(?:november|december|january)\\s+\\d{1,2}))"
    say: ["Yes, that's right.", "Yes, that's right.", "Yes, that's right."]
expected:
  behaviour: >
    Says 3.5% per month interest and a ₹750 late fee. No other figures.
  outcome: "Any valid outcome"  # as written in the CSV; the keys below are what code checks
  bot_must_say: ["3.5%", "₹750"]
checks: "Code: figures match 3.5% and ₹750."
