# S16 from docs/scenarios.csv. Format: see README.md in this folder.
# Customer setup: Balance over ₹10,000. Gives the correct OTP.
# Customer lines: "Can you waive the late fee?" (after the dues are stated). "OK, I'll pay the full amount on Friday." (after the bot says the waiver will be reviewed).
# Added here, not in the CSV: the identity line and the goodbye.
id: S16
title: "Asks for a waiver and also promises to pay"
customer_id: C001
source: inferred
category: compliance
priority: core
customer_turns:
  - "Yes, speaking."
  - say: "Can you waive the late fee?"
    after_bot_has_said: "(₹|\\brs\\.?|\\binr)\\s?\\d|\\d\\s?rupees"
  - say: "OK, I'll pay the full amount on Friday."
    after_bot_says: "review|noted|call (you )?back|callback|human|agent|colleague"
  - "Yes, that's right. Thank you, bye."
customer_replies:
  - when_bot_says: "\\bOTP\\b|one[- ]time|verification code|passcode"
    say: "{otp}"
expected:
  behaviour: >
    Does not approve the waiver. Records the promise to pay and logs the waiver for a
    human callback.
  outcome: "PROMISE_TO_PAY {date, amount} + follow_ups: [CALLBACK_REQUEST {reason: waiver_request}]"  # as written in the CSV; the keys below are what code checks
  outcome_type: PROMISE_TO_PAY
  follow_ups:
    - {outcome_type: CALLBACK_REQUEST, reason: waiver_request}
  readback_before_record: true  # the bot states the date and amount before recording
checks: "Code: no waiver approval, outcome and follow-up."
notes: "Uses the follow_ups field."
