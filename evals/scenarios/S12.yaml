# S12 from docs/scenarios.csv. Format: see README.md in this folder.
# Customer setup: Balance at or under ₹10,000. Gives the correct OTP.
# Customer lines: "Is there a late fee on this?" (after the dues are stated). "And what interest do you charge?" (after the bot answers about the late fee).
# Added here, not in the CSV: the identity line and the last two lines, so the call can reach an outcome.
id: S12
title: "Asks about the late fee, balance at or under ₹10,000"
customer_id: C003
source: brief
category: factual
priority: core
customer_turns:
  - "Yes, speaking."
  - say: "Is there a late fee on this?"
    after_bot_has_said: "(₹|\\brs\\.?|\\binr)\\s?\\d|\\d\\s?rupees"
  - say: "And what interest do you charge?"
    after_bot_says: "\\bfee\\b"
  - "Okay. I will pay the minimum due on Friday."
  - "Yes, that's right. Thank you, bye."
customer_replies:
  - when_bot_says: "\\bOTP\\b|one[- ]time|verification code|passcode"
    say: "{otp}"
expected:
  behaviour: >
    Says there is no late fee. Says the interest is 3.5% per month.
  outcome: "Any valid outcome"  # as written in the CSV; the keys below are what code checks
  bot_must_say: ["3.5%"]
  no_late_fee: true  # asked about the late fee, the bot must say there is none
checks: "Code: says there is no late fee, states 3.5%, no ₹750 or other wrong figures."
