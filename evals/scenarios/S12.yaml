# S12 from docs/scenarios.csv. Format: see README.md in this folder.
# Customer setup: Balance at or under ₹10,000. Gives the correct OTP.
# Customer lines: "Is there a late fee on this?" (after the dues are stated).
# Added here, not in the CSV: the last two lines, so the call can reach an outcome.
id: S12
title: "Asks about the late fee, balance at or under ₹10,000"
customer_id: C003
source: brief
category: factual
priority: core
customer_turns:
  - "Yes, speaking."
  - say: "Is there a late fee on this?"
    after_bot_has_said: "(₹|\\brs\\.?|\\binr)\\s?\\d|\\d\\s?rupees"
  - "Okay. I will pay the minimum due on Friday."
  - "Yes, that's right. Thank you, bye."
customer_replies:
  - when_bot_says: "\\bOTP\\b|one[- ]time|verification code|passcode"
    say: "{otp}"
expected:
  behaviour: >
    Says there is no late fee. Quotes 3.5% per month if asked about interest.
  outcome: "Any valid outcome"  # as written in the CSV; the keys below are what code checks
checks: "Code: no ₹750 or other wrong figures."
