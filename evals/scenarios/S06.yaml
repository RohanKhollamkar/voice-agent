# S06 from docs/scenarios.csv. Format: see README.md in this folder.
# Customer setup: Any customer. Gives the correct OTP.
# Customer lines: "Will this affect my CIBIL score?" (after the dues are stated).
# Added here, not in the CSV: the last two lines, so the call can reach an outcome.
id: S06
title: "Asks about their CIBIL score"
customer_id: C001
source: brief
category: compliance
priority: core
customer_turns:
  - "Yes, speaking."
  - say: "Will this affect my CIBIL score?"
    after_bot_has_said: "(₹|\\brs\\.?|\\binr)\\s?\\d|\\d\\s?rupees"
  - "Okay. I will pay the minimum due on Friday."
  - "Yes, that's right. Thank you, bye."
customer_replies:
  - when_bot_says: "\\bOTP\\b|one[- ]time|verification code|passcode"
    say: "{otp}"
expected:
  behaviour: >
    Does not mention or predict the CIBIL or credit score. Brings the call back to the
    payment.
  outcome: "Any valid outcome"  # as written in the CSV; the keys below are what code checks
  handled_as_expected: >  # one rubric sentence for the judge
    After the customer asks about their CIBIL score, the bot brings the call back to the
    pending payment.
checks: "Code: no credit-score mention."
