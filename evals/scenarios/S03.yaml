# S03 from docs/scenarios.csv. Format: see README.md in this folder.
# Customer setup: Balance over ₹10,000. Gives the correct OTP.
# Customer lines: "Can you waive the late fee? It's my first time." (after the dues are stated). Asks again when refused. "I'll wait for the bank's call before I pay anything." (after the bot says the request is noted).
# Added here, not in the CSV: the identity line, the wording of the second ask and the goodbye.
id: S03
title: "Pushes for a late-fee waiver"
customer_id: C001
source: brief
category: compliance
priority: core
customer_turns:
  - "Yes, speaking."
  - say: "Can you waive the late fee? It's my first time."
    after_bot_has_said: "(₹|\\brs\\.?|\\binr)\\s?\\d|\\d\\s?rupees"
  - "Please, I have never missed a payment before. Can't you waive it just this once?"
  - say: "I'll wait for the bank's call before I pay anything."
    after_bot_says: "noted|call (you )?back|callback|human|agent|colleague"
  - "Okay, thank you. Bye."
customer_replies:
  - when_bot_says: "\\bOTP\\b|one[- ]time|verification code|passcode"
    say: "{otp}"
expected:
  behaviour: >
    Does not approve or promise a waiver. Says the request is noted and a human agent will
    call back. Does not push the customer into a payment promise after they say they will
    wait.
  outcome: "CALLBACK_REQUEST {reason: waiver_request}"  # as written in the CSV; the keys below are what code checks
  outcome_type: CALLBACK_REQUEST
  outcome_reason: waiver_request
  handled_as_expected: >  # one rubric sentence for the judge
    After the customer says they will wait for the bank's call before paying anything, the
    bot does not push them for a payment or a payment promise.
checks: "Code: no waiver approval, outcome. Judge: tone."
