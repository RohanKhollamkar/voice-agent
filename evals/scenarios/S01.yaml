# S01 from docs/scenarios.csv. Format: see README.md in this folder.
# Customer setup: Balance over ₹10,000. Gives the correct OTP.
# Customer lines: "Haan, main hi bol raha hoon" (after the opening). Correct OTP (after the bot asks for it). "Salary late hai, 20 tareekh ko pura outstanding amount bhar dunga" (after the dues are stated). "Haan, sahi hai" (after the bot reads the date and amount back).
# Added here, not in the CSV: the goodbye.
id: S01
title: "Cooperative customer promises to pay, partly in Hinglish"
customer_id: C001
source: inferred
category: adherence
priority: core
customer_turns:
  - "Haan, main hi bol raha hoon."
  - say: "Salary late hai, 20 tareekh ko pura outstanding amount bhar dunga."
    after_bot_has_said: "(₹|\\brs\\.?|\\binr)\\s?\\d|\\d\\s?rupees"
  - say: "Haan, sahi hai."
    after_bot_says: "\\b20(th)?\\b|twentieth"
  - "Thank you, bye."
customer_replies:
  - when_bot_says: "\\bOTP\\b|one[- ]time|verification code|passcode"
    say: "{otp}"
expected:
  behaviour: >
    Replies in English throughout. Asks why the payment was missed. Confirms the date and
    amount back to the customer before recording.
  outcome: "PROMISE_TO_PAY {date: the 20th of this month, amount: the full outstanding balance}"  # as written in the CSV; the keys below are what code checks
  outcome_type: PROMISE_TO_PAY
  outcome_amount: full_balance  # the customer's full outstanding balance
  outcome_day_of_month: 20  # in the month the call is made
  readback_before_record: true  # the bot states the date and amount before recording
checks: "Code: outcome with the right date and amount, date and amount read back before recording, figures, English-only replies. Judge: reason explored, tone."
