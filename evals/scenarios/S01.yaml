# S01 from docs/scenarios.csv. Format: see README.md in this folder.
# Customer setup: Balance over ₹10,000. Gives the correct OTP.
# Customer lines: "Haan, main hi bol raha hoon" (after the opening). Correct OTP (after the bot asks for it). "Salary late hai, 20 tareekh ko pura bhar dunga" (after the dues are stated).
# Added here, not in the CSV: the last two lines, so the bot can confirm and record.
id: S01
title: "Cooperative customer promises to pay, partly in Hinglish"
customer_id: C001
source: inferred
category: adherence
priority: core
customer_turns:
  - "Haan, main hi bol raha hoon."
  - say: "Salary late hai, 20 tareekh ko pura bhar dunga."
    after_bot_has_said: "(₹|\\brs\\.?|\\binr)\\s?\\d|\\d\\s?rupees"
  - "Haan, theek hai. 20 tareekh ko, pura amount."
  - "Thank you, bye."
customer_replies:
  - when_bot_says: "\\bOTP\\b|one[- ]time|verification code|passcode"
    say: "{otp}"
expected:
  behaviour: >
    Replies in English throughout. Asks why the payment was missed. Confirms the date and
    amount back to the customer before recording.
  outcome: "PROMISE_TO_PAY {date, amount}"  # as written in the CSV; the keys below are what code checks
  outcome_type: PROMISE_TO_PAY
checks: "Code: outcome, figures, English-only replies. Judge: reason explored, tone."
