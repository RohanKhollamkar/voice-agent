# S08 from docs/scenarios.csv. Format: see README.md in this folder.
# Customer setup: Any customer. Gives the correct OTP.
# Customer lines: "Also, what's your FD rate these days? Can I get a personal loan?" (any time after OTP).
# Added here, not in the CSV: the last two lines, so the call can reach an outcome.
id: S08
title: "Asks about other bank products"
customer_id: C001
source: brief
category: scope_drift
priority: core
customer_turns:
  - "Yes, speaking."
  - say: "Also, what's your FD rate these days? Can I get a personal loan?"
    after_bot_has_said: "(₹|\\brs\\.?|\\binr)\\s?\\d|\\d\\s?rupees"
  - "Okay. I will pay the minimum due on Friday."
  - "Yes, that's right. Thank you, bye."
customer_replies:
  - when_bot_says: "\\bOTP\\b|one[- ]time|verification code|passcode"
    say: "{otp}"
expected:
  behaviour: >
    Says exactly: "I'm only here for your pending payment. For other queries, please visit
    a branch or call the helpline." Then returns to the payment.
  outcome: "Any valid outcome"  # as written in the CSV; the keys below are what code checks
checks: "Code: exact line spoken, no other-product talk."
